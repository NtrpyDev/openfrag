[package]
name = "openfrag-import"
version.workspace = true
edition.workspace = true

[dependencies]
sha2 = "0.10"
serde_json = "1"

[features]
default = []
demoparser = ["dep:demoparser-parser", "dep:ahash"]

[dependencies.demoparser-parser]
package = "parser"
path = "vendor/demoparser-parser"
optional = true

[dependencies.ahash]
version = "0.8"
optional = true

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "openfrag-parser-benchmark"
path = "src/bin/openfrag-parser-benchmark.rs"
required-features = ["demoparser"]

[[bin]]
name = "openfrag-compat-lab"
path = "src/bin/openfrag-compat-lab.rs"
required-features = ["demoparser"]

[[bin]]
name = "openfrag-schema"
path = "src/bin/openfrag-schema.rs"

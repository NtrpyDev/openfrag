[package]
name = "global-shortcuts-introspection"
version = "0.1.0"
edition = "2021"
description = "Non-invasive XDG Global Shortcuts portal introspection probe for issue 23"

[dependencies]
ashpd = { version = "0.13.12", default-features = false, features = ["global_shortcuts", "tokio"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

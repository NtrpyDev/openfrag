[package]
name = "openfrag-import"
version.workspace = true
edition.workspace = true

[dependencies]
sha2 = "0.10"

[features]
default = []
demoparser = ["dep:demoparser-parser", "dep:ahash", "dep:serde_json"]

[dependencies.demoparser-parser]
package = "parser"
path = "vendor/demoparser-parser"
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.ahash]
version = "0.8"
optional = true

[dev-dependencies]
tempfile = "3"

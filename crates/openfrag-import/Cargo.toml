[package]
name = "openfrag-import"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"

[features]
default = []
demoparser = ["dep:demoparser-parser", "dep:ahash"]

[dependencies.demoparser-parser]
package = "parser"
path = "vendor/demoparser-parser"
optional = true

[dependencies.ahash]
version = "0.8"
optional = true

[dev-dependencies]
tempfile = "3"

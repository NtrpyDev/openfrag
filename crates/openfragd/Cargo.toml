[package]
name = "openfragd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", features = ["json", "multipart"] }
clap = { version = "4.5", features = ["derive"] }
openfrag-capture = { path = "../openfrag-capture" }
openfrag-clips = { path = "../openfrag-clips" }
openfrag-gsi = { path = "../openfrag-gsi" }
openfrag-import = { path = "../openfrag-import", features = ["demoparser"] }
openfrag-live = { path = "../openfrag-live" }
openfrag-pipeline = { path = "../openfrag-pipeline", features = ["demoparser"] }
openfrag-setup = { path = "../openfrag-setup" }
openfrag-shortcuts = { path = "../openfrag-shortcuts" }
openfrag-storage = { path = "../openfrag-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"

[lints]
workspace = true

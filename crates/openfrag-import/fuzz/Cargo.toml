[package]
name = "openfrag-import-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
openfrag-import = { path = "..", features = ["demoparser"] }
serde_json = "1"

[[bin]]
name = "raw_decoder"
path = "fuzz_targets/raw_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalizer"
path = "fuzz_targets/normalizer.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

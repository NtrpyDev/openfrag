name: Verify

on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
    branches: [main, 'implementation/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore Cargo cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - name: Verify first-party crates
        run: ./scripts/verify-ci.sh

[package]
name = "openfrag-shortcuts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "tokio"] }
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

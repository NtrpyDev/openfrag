name: Verify

on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
    branches: [main, 'implementation/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Restore Cargo cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy && rustup default 1.96.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install pinned browser harness
        run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run complete whole-app verification
        run: python3 scripts/test_suite.py complete
      - name: Preserve shard logs and timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whole-app-verification
          path: target/openfrag-suite/runs/
          if-no-files-found: warn
          retention-days: 14
